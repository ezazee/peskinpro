<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thermal Receipt</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0;
      font-family: Arial, sans-serif;
    }

    .receipt {
      width: 300px;
      background: #fff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      font-size: 14px;
      line-height: 1.6;
    }

    .receipt .logo {
      align-items: center;
      font-weight: bold;
      width:35px;
      margin-bottom: 10px;
    }

    .receipt .date-time {
      text-align: center;
      font-size: 12px;
      margin-bottom: 15px;
    }

    .receipt .token {
      text-align: center;
      font-weight: bold;
      font-size: 16px;
      padding: 10px;
      border: 1px dashed #000;
      margin: 15px 0;
    }

    .receipt .details {
      margin: 10px 0;
    }

    .receipt .details .row {
      display: flex;
      justify-content: space-between;
      margin: 5px 0;
    }

    .receipt .details .row span {
      font-size: 14px;
    }

    .receipt .total {
      margin: 15px 0;
      font-weight: bold;
    }

    .receipt .operator {
      text-align: center;
      margin: 15px 0;
    }

    .receipt .operator-logo-top {
      text-align: center;
    }

    .receipt .operator .brand {
      margin-top: 10px;
      font-weight: bold;
      width: 50px;
    }

    .receipt .zigzag {
      margin-top: 15px;
      height: 10px;
      background: repeating-linear-gradient(
        -45deg,
        #fff,
        #fff 5px,
        #000 5px,
        #000 10px
      );
    }
  </style>
</head>
<body>
  <div class="receipt">
    <div class="operator-logo-top">
        <img src="https://raw.githubusercontent.com/ezazee/peskinpro/refs/heads/dev/public/frontend/assets/images/logo/peskin.png" class="logo"></img>
    </div>
    <div class="date-time">Wed, May 27, 2020 • 9:27:53 AM</div>
    <div class="token">0237-7746-8981-9028-5626</div>
    <div class="details">
      <div class="row">
        <span>Token Type</span>
        <span>Credit</span>
      </div>
      <div class="row">
        <span>Customer Name</span>
        <span>Victor Shoaga</span>
      </div>
      <div class="row">
        <span>Customer Type</span>
        <span>R3</span>
      </div>
      <div class="row">
        <span>Address</span>
        <span>7953 Oakland St.<br>Honolulu, HI 96815</span>
      </div>
      <div class="row">
        <span>Meter Number</span>
        <span>04172997324</span>
      </div>
      <div class="row">
        <span>Amount</span>
        <span>950 NGN</span>
      </div>
      <div class="row">
        <span>Tax</span>
        <span>50 NGN</span>
      </div>
      <div class="total">
        <div class="row">
          <span>Total</span>
          <span>1000 NGN</span>
        </div>
      </div>
    </div>
    <div class="operator">
      <span>Operator</span><br>
      <span>Ade</span>
      <p>
        <img src="https://raw.githubusercontent.com/ezazee/peskinpro/refs/heads/dev/public/frontend/assets/images/logo/peskin.png" class="brand"></img>
      </p>
    </div>
  </div>
</body>
</html>
